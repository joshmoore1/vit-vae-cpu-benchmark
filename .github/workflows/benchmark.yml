name: "ViT VAE Benchmark"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Benchmark Sample Identifier"
        required: true
        default: "benchmark_sample"
      dtype:
        description: "Execution Precision"
        required: true
        default: "float32"
        type: choice
        options:
          - "float32"
          - "bfloat16"
      tile_config:
        description: "Spatial Tiling Strategy"
        required: true
        default: "no_tile"
        type: choice
        options:
          - "no_tile"
          - "single_tile"
          - "fast_512"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: "CPU ViT Evaluation"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      REGISTRY: ${{ secrets.REGISTRY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch CPU & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fetch benchmark sample
        run: |
          rclone copyto "${REGISTRY}samples/${{ inputs.job_id }}.bin" ./input.bin

      - name: Execute ViT VAE benchmark
        run: |
          TILE_ARGS="--no-tile"
          if [ "${{ inputs.tile_config }}" = "fast_512" ]; then
            TILE_ARGS="--tile-size 512 512"
          elif [ "${{ inputs.tile_config }}" = "single_tile" ]; then
            TILE_ARGS="--tile-size 544 960"
          fi

          python run_benchmark.py "./input.bin" \
            --dtype "${{ inputs.dtype }}" \
            --output "./eval_artifact.bin" \
            $TILE_ARGS

      - name: Record evaluation metrics
        run: |
          RECORD_ID="${{ inputs.job_id }}"
          TIMESTAMP=$(TZ="America/New_York" date +'%Y-%m-%d %H:%M:%S %Z')
          echo "=== ViT VAE Evaluation Record ==="
          echo "Record Identifier: ${RECORD_ID}"
          echo "Completed:         ${TIMESTAMP}"
          echo "Status:            COMPLETED"
          echo "Archiving artifacts to evaluation registry..."
          rclone copyto ./eval_artifact.bin "${REGISTRY}evaluations/${RECORD_ID}.bin"
          echo "Artifact registry synchronization complete."
