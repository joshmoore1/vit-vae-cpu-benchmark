name: "ViT VAE Benchmark"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Benchmark Sample Identifier"
        required: true
        default: "benchmark_sample"
      dtype:
        description: "Execution Precision"
        required: true
        default: "float32"
        type: choice
        options:
          - "float32"
          - "bfloat16"

permissions:
  contents: read
  packages: read

concurrency:
  group: benchmark-queue
  cancel-in-progress: false

jobs:
  benchmark:
    name: "CPU ViT Evaluation"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    container:
      image: ghcr.io/${{ github.repository }}/vae-runner:latest

    env:
      PYTHONUNBUFFERED: "1"
      REGISTRY: ${{ secrets.REGISTRY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch benchmark sample
        run: |
          rclone copyto "${REGISTRY}samples/${{ inputs.job_id }}.bin" ./input.bin -q 2>/dev/null

      # 1. Restore cached model if already downloaded in a previous run
      - name: Cache VAE Model
        id: cache-vae
        uses: actions/cache@v4
        with:
          path: ./minimax_h3_video_vae_fp16.safetensors
          key: minimax-h3-vae-v1

      # 2. Download only if cache miss (only runs on the first execution)
      - name: Download VAE weights on cache miss
        if: steps.cache-vae.outputs.cache-hit != 'true'
        run: |
          curl -L -C - "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_fp16.safetensors" \
            -o ./minimax_h3_video_vae_fp16.safetensors
            
      - name: Execute ViT VAE benchmark
        run: |
          python run_benchmark.py "./input.bin" \
            --vae_path "./minimax_h3_video_vae_fp16.safetensors" \
            --dtype "${{ inputs.dtype }}" \
            --no-tile \
            --output "./eval_artifact.bin" \
            --metrics-out "./benchmark_metrics.json"

      - name: Record evaluation metrics
        run: |
          RECORD_ID="${{ inputs.job_id }}"
          TIMESTAMP=$(TZ="America/New_York" date +'%Y-%m-%d %H:%M:%S %Z')
          CPU_MODEL=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)
          CPU_CORES=$(nproc)

          SIMD="x86_64 Baseline"
          if grep -q "avx512" /proc/cpuinfo; then
            SIMD="AVX-512 (512-bit SIMD)"
          elif grep -q "avx2" /proc/cpuinfo; then
            SIMD="AVX2 (256-bit SIMD)"
          fi

          DIMS="N/A"
          LAYER_RATE="N/A"
          PEAK_RSS="N/A"
          DECODE_LATENCY="N/A"
          if [ -f benchmark_metrics.json ]; then
            LAYER_RATE="$(jq -r '"\(.layer_rate_sec) s / transformer block"' benchmark_metrics.json)"
            PEAK_RSS="$(jq -r '"\(.peak_rss_mb) MB"' benchmark_metrics.json)"
            DECODE_LATENCY="$(jq -r '"\(.decode_duration_min) min (\(.decode_duration_sec)s)"' benchmark_metrics.json)"
            DIMS="$(jq -r '"\(.width)x\(.height) @ \(.fps) fps (\(.frames) frames)"' benchmark_metrics.json)"
          fi

          echo "=== ViT VAE Evaluation Record ==="
          echo "Record Identifier: ${RECORD_ID}"
          echo "Completed:         ${TIMESTAMP}"
          echo "Compute Hardware:  ${CPU_MODEL} (${CPU_CORES} threads)"
          echo "Vector Extensions: ${SIMD}"
          echo "Archiving artifacts to evaluation registry..."
          rclone copyto ./eval_artifact.bin "${REGISTRY}evaluations/${RECORD_ID}.bin" -q 2>/dev/null
          echo "Artifact registry synchronization complete."

          echo "Publishing benchmark report to GitHub Step Summary..."
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### 📊 3D ViT Video VAE Benchmark Summary

          | Metric | Measured Value |
          | :--- | :--- |
          | **Model** | \`MiniMax-H3 AutoencoderKL\` |
          | **Run Identifier** | \`${RECORD_ID}\` |
          | **Execution Timestamp** | \`${TIMESTAMP}\` |
          | **Compute Hardware** | ${CPU_MODEL} (${CPU_CORES} threads) |
          | **Vector Engine** | \`${SIMD}\` |
          | **Evaluation Dimensions** | ${DIMS} |
          | **Execution Precision** | \`${{ inputs.dtype }}\` |
          | **Layer Latency** | **${LAYER_RATE}** |
          | **Peak Memory (RSS)** | **${PEAK_RSS}** |
          | **Total Decode Latency** | **${DECODE_LATENCY}** |
          | **Evaluation Status** | \`RECORDED\` |
          EOF
